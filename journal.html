<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal writer</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; color: #555; margin: 14px 0 4px; }
  input, textarea { width: 100%; font-size: 14px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  input { font-family: ui-monospace, monospace; }
  textarea { min-height: 90px; resize: vertical; }
  #entry { min-height: 140px; font-size: 16px; }
  button { font-size: 1rem; padding: .75rem 1.5rem; border-radius: 8px; border: 0; background: #1f883d; color: #fff; cursor: pointer; margin-top: 14px; }
  button:disabled { background: #999; }
  pre { background: #f4f4f4; padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .warn { background: #fff8e1; border: 1px solid #f0c36d; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 14px; }
  .ok { color: #1f883d; font-weight: 700; }
  .err { color: #c00; font-weight: 700; }
</style>
</head>
<body>
<h1>📓 Journal writer</h1>
<p>Writes entries to <code>journal/YYYY-MM-DD.md</code> in your repo, through your GitHub App. Everything happens in this page — your private key never leaves your browser.</p>

<label>App ID (the numeric <code>id</code> from the conversion)</label>
<input id="appId" placeholder="e.g. 123456" autocomplete="off">

<label>Private key (the <code>pem</code> value, including BEGIN/END lines)</label>
<textarea id="pem" placeholder="-----BEGIN PRIVATE KEY-----&#10;...&#10;-----END PRIVATE KEY-----" spellcheck="false" autocomplete="off"></textarea>

<label>Repo (owner/name — the app must be installed on it)</label>
<input id="repo" value="alanc142/journal" spellcheck="false" autocomplete="off">

<label>Entry</label>
<textarea id="entry" placeholder="Dear journal…"></textarea>

<button id="save">Save entry</button>
<div class="warn">Your private key stays in this page only. Don't paste it into any chat.</div>
<pre id="out">waiting…</pre>

<script>
const $ = id => document.getElementById(id);
const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64urlStr = s => b64url(new TextEncoder().encode(s));

async function pemToKey(pem) {
  const b64 = pem.replace(/-----(BEGIN|END) PRIVATE KEY-----/g, '').replace(/\s/g, '');
  const der = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return crypto.subtle.importKey('pkcs8', der, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
}
async function makeJwt(appId, key) {
  const header = b64urlStr(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
  const now = Math.floor(Date.now() / 1000);
  const payload = b64urlStr(JSON.stringify({ iat: now - 60, exp: now + 600, iss: String(appId) }));
  const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(header + '.' + payload));
  return header + '.' + payload + '.' + b64url(new Uint8Array(sig));
}
const gh = (url, token, opts = {}) => fetch(url, {
  ...opts,
  headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', ...(opts.headers || {}) },
});

$('save').addEventListener('click', async () => {
  const out = $('out'), btn = $('save');
  const appId = $('appId').value.trim(), pem = $('pem').value.trim();
  const repo = $('repo').value.trim(), text = $('entry').value.trim();
  if (!appId || !pem || !repo || !text) { out.innerHTML = '<span class="err">fill in every field first.</span>'; return; }
  btn.disabled = true; out.textContent = 'signing in as your app…';
  try {
    const key = await pemToKey(pem);
    const jwt = await makeJwt(appId, key);
    out.textContent = 'finding installation…';
    const instRes = await gh('https://api.github.com/app/installations', jwt);
    const insts = await instRes.json();
    if (!instRes.ok) throw new Error('installations: ' + (insts.message || instRes.status));
    if (!insts.length) throw new Error('the app is not installed anywhere yet — install it on your repo first (github.com/settings/apps → your app → Install App).');
    const inst = insts.find(i => repo.toLowerCase().startsWith((i.account.login + '/').toLowerCase())) || insts[0];
    out.textContent = 'getting access token…';
    const tokRes = await gh(`https://api.github.com/app/installations/${inst.id}/access_tokens`, jwt, { method: 'POST' });
    const tok = await tokRes.json();
    if (!tokRes.ok) throw new Error('token: ' + (tok.message || tokRes.status));

    const now = new Date();
    const day = now.toISOString().slice(0, 10);
    const hm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    const path = `journal/${day}.md`;
    out.textContent = 'saving entry…';
    let sha, md;
    const cur = await gh(`https://api.github.com/repos/${repo}/contents/${path}`, tok.token);
    if (cur.ok) {
      const j = await cur.json(); sha = j.sha;
      md = decodeURIComponent(escape(atob(j.content.replace(/\s/g,''))));
      md += `\n\n## ${hm}\n${text}\n`;
    } else {
      md = `# Journal — ${day}\n\n## ${hm}\n${text}\n`;
    }
    const put = await gh(`https://api.github.com/repos/${repo}/contents/${path}`, tok.token, {
      method: 'PUT',
      body: JSON.stringify({ message: `journal entry ${day} ${hm}`, content: btoa(unescape(encodeURIComponent(md))), ...(sha ? { sha } : {}) }),
    });
    const pj = await put.json();
    if (!put.ok) throw new Error('save: ' + (pj.message || put.status));
    out.innerHTML = `<span class="ok">saved ✓</span> → <code>${path}</code> in ${repo}`;
    $('entry').value = '';
  } catch (e) {
    out.innerHTML = '<span class="err">failed:</span> ' + (e.message || e);
  }
  btn.disabled = false;
});
</script>
</body>
</html>
